name = "revere-site"
compatibility_date = "2026-10-01"

# Attach the apex and www as Workers custom domains on every deploy.
routes = [
  { pattern = "reverecoalition.com", custom_domain = true },
  { pattern = "www.reverecoalition.com", custom_domain = true },
]

[assets]
# Only public/ is served. Nothing at the repo root ships.
directory = "./public"
not_found_handling = "404-page"
